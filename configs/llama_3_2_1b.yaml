# Llama 3.2 1B Fine-tuning Configuration for ATP 6-0.5
# Optimized for lower memory devices and faster training

# Model Configuration
model:
  name: "unsloth/Llama-3.2-1B-Instruct"  # Smaller 1B model
  max_seq_length: 2048
  load_in_4bit: true
  dtype: "auto"

# LoRA Configuration (QLoRA)
lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  use_gradient_checkpointing: true
  use_rslora: false
  use_dora: false

# Training Configuration
training:
  output_dir: "./models/llama-3.2-1b-atp"
  num_train_epochs: 3
  per_device_train_batch_size: 4          # Can use larger batch size
  gradient_accumulation_steps: 2          # Smaller accumulation needed
  warmup_steps: 10
  learning_rate: 2.0e-4
  fp16: false
  bf16: true
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 3
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  seed: 42
  max_grad_norm: 1.0
  group_by_length: true
  report_to: "tensorboard"
  logging_dir: "./logs"
  evaluation_strategy: "epoch"
  
# Data Configuration
data:
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/eval.jsonl"
  test_file: "data/processed/test.jsonl"
  prompt_template: |
    ### Instruction:
    You are an expert on ATP 6-0.5 (Mission Command). Answer the following question based on the manual.
    
    ### Question:
    {input}
    
    ### Answer:
    {output}
  max_length: 2048
  train_split: 0.8
  eval_split: 0.1
  
# Inference Configuration
inference:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true

# Edge Deployment Configuration
edge:
  quantization_method: "q4_k_m"
  context_length: 2048
  gpu_layers: 0
  threads: 4
